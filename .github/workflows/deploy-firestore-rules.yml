# Deploys firestore.rules and storage.rules whenever they change on main.
#
# ── ONE-TIME SETUP ────────────────────────────────────────────────────────
# 1. Firebase Console → Project Settings → Service Accounts
#    → "Generate new private key" → downloads a .json file
# 2. Add it as a repository secret named FIREBASE_SERVICE_ACCOUNT:
#
#      gh secret set FIREBASE_SERVICE_ACCOUNT < path/to/downloaded.json
#
#    (or GitHub → Settings → Secrets and variables → Actions → New secret,
#     pasting the entire file contents)
# 3. That's it. Rules deploy on every push that touches them, forever.
#
# The service account needs TWO roles in Google Cloud Console -> IAM:
#   * Firebase Rules Admin      (roles/firebaserules.admin)   - writes the rules
#   * Service Usage Consumer    (roles/serviceusage.serviceUsageConsumer)
#
# The second one is the non-obvious one. Before deploying, the Firebase CLI asks
# serviceusage.googleapis.com whether the Firestore API is enabled; without that
# role the call 403s and the deploy dies before it ever touches the rules:
#
#   Error: ... had HTTP Error: 403, Permission denied to get service
#   [firestore.googleapis.com]
#
# Every run of this workflow failed that way until the role was granted.
name: Deploy Firebase Rules

on:
  push:
    branches: [main]
    paths:
      - 'firestore.rules'
      - 'storage.rules'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/deploy-firestore-rules.yml'
  workflow_dispatch:

jobs:
  deploy-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Check the service account secret exists
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT secret is not set. See the setup steps at the top of this file."
            exit 1
          fi

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Write credentials
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          node -e 'JSON.parse(require("fs").readFileSync(process.env.RUNNER_TEMP + "/sa.json","utf8"))' \
            || { echo "::error::FIREBASE_SERVICE_ACCOUNT is not valid JSON."; exit 1; }
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      # Storage is a separate step on purpose. Bundling it with Firestore made
      # every run fail: the CLI tries to enable firebasestorage.googleapis.com
      # and the service account cannot enable APIs. Create Account was 403ing
      # because these repo rules never reached production.
      - name: Deploy Firestore rules
        run: firebase deploy --only firestore:rules --project gohil-investments --non-interactive

      - name: Deploy Storage rules
        continue-on-error: true
        run: firebase deploy --only storage --project gohil-investments --non-interactive

      - name: Remove credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
