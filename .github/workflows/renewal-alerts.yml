# .github/workflows/renewal-alerts.yml
# ─────────────────────────────────────────────────────────────
# FREE Daily Renewal Email Alert
# Runs every morning at 7:00 AM IST (1:30 AM UTC).
# Queries Firestore for policies expiring within 30 days and
# sends a formatted HTML email via Gmail SMTP (free).
#
# ── SETUP (one-time) ──────────────────────────────────────────
# 1. Go to your GitHub repo → Settings → Secrets and variables
#    → Actions → "New repository secret"  and add:
#
#    FIREBASE_PROJECT_ID      → your Firebase project ID
#    FIREBASE_CLIENT_EMAIL    → from your service account JSON
#    FIREBASE_PRIVATE_KEY     → from your service account JSON
#                               (paste the entire key including
#                                -----BEGIN... and -----END...)
#    GMAIL_USER               → your Gmail address
#    GMAIL_APP_PASSWORD       → 16-char App Password from
#                               myaccount.google.com → Security
#                               → 2-Step Verification → App passwords
#    ALERT_EMAIL_TO           → email(s) to receive the alerts
#                               (comma-separated for multiple)
#
# 2. How to get a Firebase Service Account key:
#    Firebase Console → Project Settings → Service Accounts
#    → Generate new private key → download JSON
#    → copy client_email and private_key into the secrets above.
# ─────────────────────────────────────────────────────────────

name: 🔔 Daily Renewal Alerts

on:
  schedule:
    # 1:30 UTC = 7:00 AM IST every day
    - cron: '30 1 * * *'
  # Allow manual trigger from the Actions tab
  workflow_dispatch:

jobs:
  send-alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        # npm ci, not a hand-picked list: the script now shares the app's date
        # helpers, so it needs the same date-fns the app was tested against.
        run: npm ci

      # ── Core script: query Firestore → build email → send ────
      - name: Send renewal alert email
        env:
          # Shared with deploy-firestore-rules.yml. The three FIREBASE_* vars
          # below are only a fallback if this one is ever unset.
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID:   ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY:  ${{ secrets.FIREBASE_PRIVATE_KEY }}
          GMAIL_USER:            ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD:    ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_EMAIL_TO:        ${{ secrets.ALERT_EMAIL_TO }}
        run: node .github/scripts/send-renewal-alerts.js
