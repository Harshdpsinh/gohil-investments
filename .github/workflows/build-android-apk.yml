name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install web dependencies
        run: npm ci

      - name: Build web application
        run: npm run build

      - name: Bundle web application inside APK
        run: node -e 'const fs=require("fs");const p="capacitor.config.json";const c=JSON.parse(fs.readFileSync(p));delete c.server;fs.writeFileSync(p,JSON.stringify(c,null,2))'

      - name: Synchronize Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload sideloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: gohil-investments-fixed-bundled-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
